version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: tilora_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tilora_db}
      POSTGRES_USER: ${POSTGRES_USER:-tilora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tilora_secure_password_2026}
    volumes:
      - tilora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tilora_user} -d ${POSTGRES_DB:-tilora_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tilora_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tilora_web_app
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tilora_user}:${POSTGRES_PASSWORD:-tilora_secure_password_2026}@db:5432/${POSTGRES_DB:-tilora_db}
      SECRET_KEY: ${SECRET_KEY:-tilora_production_super_secret_jwt_key_2026}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WORKERS: ${WORKERS:-4}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tilora_net

  nginx:
    image: nginx:alpine
    container_name: tilora_nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - tilora_net

volumes:
  tilora_pgdata:
    driver: local

networks:
  tilora_net:
    driver: bridge
