version: '3.8'

# Maxfiy qiymatlar faqat .env faylidan olinadi (standart parol yo'q):
# POSTGRES_PASSWORD va SECRET_KEY bo'sh bo'lsa docker compose xato beradi.
services:
  db:
    image: postgres:16-alpine
    container_name: tilora_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tilora_db}
      POSTGRES_USER: ${POSTGRES_USER:-tilora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env faylida belgilanishi shart}
    volumes:
      - tilora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tilora_user} -d ${POSTGRES_DB:-tilora_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tilora_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tilora_web_app
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tilora_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tilora_db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY .env faylida belgilanishi shart (kamida 32 belgi)}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.b.ai/v1}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash-vision-exp}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      WORKERS: ${WORKERS:-4}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tilora_net

  nginx:
    image: nginx:alpine
    container_name: tilora_nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - tilora_net

volumes:
  tilora_pgdata:
    driver: local

networks:
  tilora_net:
    driver: bridge
