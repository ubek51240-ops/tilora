upstream tilora_backend {
    server web:8010;
}

# So'rovlar chegarasi (brute-force va AI kalitni suiiste'mol qilishdan himoya)
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;
    server_tokens off;

    # Gzip siqish
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Xavfsizlik sarlavhalari (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=()" always;
    # HTTPS yoqilgach (certbot) quyidagi qatorni oching:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Let's Encrypt tekshiruvi
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Login va ro'yxatdan o'tish: daqiqasiga 10 ta (portlash 5)
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://tilora_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API: daqiqasiga 120 ta (portlash 40)
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://tilora_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # Statik fayllar keshini boshqarish
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|wav|mp3)$ {
        proxy_pass http://tilora_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Barcha so'rovlarni FastAPI serveriga yo'naltirish
    location / {
        proxy_pass http://tilora_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }
}
